name: Auto Patch Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: leaveflow-auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse stale CI results
        id: candidate
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; its CI run will own the next release."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Compute next patch tag
        if: steps.candidate.outputs.release == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Tag validated commit
        if: steps.candidate.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Refusing to move existing release tag $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$VALIDATED_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub release
        if: steps.candidate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh release create "$TAG"
          --verify-tag
          --target "$VALIDATED_SHA"
          --generate-notes
          --title "LeaveFlow $TAG"