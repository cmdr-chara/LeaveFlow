name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt
      - run: python backend/manage.py test leave
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
  notification-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: notification_worker } }
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.4'
          elixir-version: '1.20.2'
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
      - run: mix compile --warnings-as-errors
  notifications:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: notifications } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: notifications/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  kubernetes-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate Kustomize overlays
        shell: bash
        run: |
          for overlay in deploy/k8s deploy/k8s/overlays/ingress deploy/k8s/overlays/secure deploy/k8s/overlays/full; do
            kubectl kustomize "$overlay" > /dev/null
          done
