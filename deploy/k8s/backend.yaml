apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: leaveflow-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: leaveflow-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: leaveflow-config
            - secretRef:
                name: leaveflow-secrets
        - name: seed-demo
          image: leaveflow-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - manage.py
            - seed_demo
          envFrom:
            - configMapRef:
                name: leaveflow-config
            - secretRef:
                name: leaveflow-secrets
      containers:
        - name: backend
          image: leaveflow-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - config.wsgi:application
            - --bind
            - 0.0.0.0:8000
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: leaveflow-config
            - secretRef:
                name: leaveflow-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
