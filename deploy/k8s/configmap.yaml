apiVersion: v1
kind: ConfigMap
metadata:
  name: leaveflow-config
data:
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,backend.leaveflow.svc.cluster.local"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  BACKEND_URL: http://backend:8000
  PORT: "3000"
  LOG_LEVEL: info
  NODE_ENV: production
  VITE_API_URL: http://localhost:8000/api
  VITE_NOTIFICATIONS_URL: http://localhost:3000
