apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: leaveflow

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - notifications.yaml
  - frontend.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml

commonLabels:
  app.kubernetes.io/part-of: leaveflow
  app.kubernetes.io/managed-by: kustomize
