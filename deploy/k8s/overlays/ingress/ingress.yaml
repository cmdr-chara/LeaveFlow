apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leaveflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: leaveflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  name: http
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
