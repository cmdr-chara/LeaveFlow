services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: leaveflow, POSTGRES_USER: leaveflow, POSTGRES_PASSWORD: leaveflow }
    volumes: ["leaveflow_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U leaveflow"], interval: 5s, timeout: 3s, retries: 10 }
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: { POSTGRES_DB: leaveflow, POSTGRES_USER: leaveflow, POSTGRES_PASSWORD: leaveflow, POSTGRES_HOST: db, DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend" }
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment: { VITE_API_URL: "http://localhost:8000/api" }
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: { leaveflow_data: {} }
