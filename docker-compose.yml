services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leaveflow
      POSTGRES_USER: leaveflow
      POSTGRES_PASSWORD: leaveflow
    volumes: ["leaveflow_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["leaveflow_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: leaveflow
      POSTGRES_USER: leaveflow
      POSTGRES_PASSWORD: leaveflow
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-worker:
    build:
      context: .
      dockerfile: notification_worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      PORT: 3000
      LOG_LEVEL: info
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
      notification-worker: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_NOTIFICATIONS_URL: http://localhost:3000
    ports: ["5173:5173"]
    depends_on:
      backend: { condition: service_started }
      notifications: { condition: service_healthy }

volumes:
  leaveflow_data: {}
  leaveflow_redis: {}
